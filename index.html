<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title>🫧 一時記憶逃し</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>🫧 一時記憶逃し</h1><p>いま頭に保持している考えや気づきを、忘れてゼロから考え直す前に頭から降ろす場所。</p></div><div class="backup" id="backupStatus">最終JSON書き出し：まだありません</div></header>
<main>
<section class="panel input-panel"><form id="cardForm"><input type="hidden" id="editId"><label>URL <span>任意</span><input id="url" type="url" inputmode="url" placeholder="https://example.com"></label><label>タイトル <span>任意</span><input id="title" type="text" placeholder="空ならURLを表示"></label><label class="wide">メモ <span>任意</span><textarea id="memo" rows="3" placeholder="記事にするとき思い出したいこと"></textarea></label><div class="form-actions wide"><button class="primary" id="submitBtn" type="submit">追加</button><button class="ghost hidden" id="cancelEdit" type="button">編集をやめる</button><span id="formError" class="error" aria-live="polite"></span></div></form></section>
<section class="toolbar"><div><strong id="count">0件</strong><label class="inline">並び順 <select id="sortOrder"><option value="newest">新しい順</option><option value="oldest">古い順</option></select></label></div><div class="tools"><button id="exportJson">JSON書き出し</button><label class="file-button">JSON読み込み<input id="importJson" type="file" accept="application/json,.json"></label><button id="exportHtml">HTML書き出し</button><button class="danger-outline" id="resetAll">全件リセット</button></div></section>
<section id="empty" class="empty">まだネタはありません。タイトルだけでも追加できます。</section><section id="cards" class="cards"></section>
</main>
<dialog id="htmlDialog"><form method="dialog"><h2>HTMLを書き出す</h2><p>アーカイブ内の並び順を選んでください。</p><label><input type="radio" name="htmlSort" value="newest" checked> 新しい順</label><label><input type="radio" name="htmlSort" value="oldest"> 古い順</label><div class="dialog-actions"><button value="cancel">キャンセル</button><button id="confirmHtml" value="default" class="primary">書き出す</button></div></form></dialog>
<dialog id="mergeDialog"><div><h2>マージ時の衝突</h2><p id="mergeProgress"></p><div class="compare"><article><h3>現在のカード</h3><div id="currentCard"></div></article><article><h3>読み込み側</h3><div id="incomingCard"></div></article></div><div class="dialog-actions wrap"><button data-choice="current">現在を残す</button><button data-choice="incoming">読み込み側を採用</button><button data-choice="both">どちらも残す</button></div></div></dialog>
<script src="app.js"></script></body></html>
